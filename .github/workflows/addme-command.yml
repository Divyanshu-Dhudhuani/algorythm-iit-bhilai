name: addme-command

# Fully automatic scaffolding: a student opens an issue titled
# `add me: <NAME>-<ID>` and this provisions their branch + folder +
# students.json entry + PR. The GitHub username always comes from the issue
# author, so ownership cannot be spoofed.

on:
  issues:
    types: [opened]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  provision:
    if: startsWith(github.event.issue.title, 'add me:') || startsWith(github.event.issue.title, 'Add me:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Provision page + PR from issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python3 .github/scripts/provision.py --title "$ISSUE_TITLE" --author "$ISSUE_AUTHOR" --issue "$ISSUE_NUMBER"
